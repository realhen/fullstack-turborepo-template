services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_PASSWORD: local-postgres-password
      POSTGRES_USER: app
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'node_modules/@repo/database/dist/migrate.js']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app:local-postgres-password@postgres:5432/app
      NODE_ENV: development
    restart: 'no'

  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'node_modules/@repo/database/dist/seed.js']
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      AUTH_LOCAL_SUBJECT: local-developer
      DATABASE_SEED_LOCAL: 'true'
      DATABASE_URL: postgresql://app:local-postgres-password@postgres:5432/app
      NODE_ENV: development
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      AUTH_LOCAL_EMAIL: developer@example.test
      AUTH_LOCAL_ORGANIZATION_ID: 00000000-0000-4000-8000-000000000001
      AUTH_LOCAL_ORGANIZATION_NAME: Local organization
      AUTH_LOCAL_ORGANIZATION_SLUG: local-org
      AUTH_LOCAL_PROJECT_ID: 00000000-0000-4000-8000-000000000002
      AUTH_LOCAL_PROJECT_NAME: Local project
      AUTH_LOCAL_SCOPES: profile:read,organizations:read
      AUTH_LOCAL_SUBJECT: local-developer
      AUTH_LOCAL_TOKEN: local-development-token-change-me-1234567890
      AUTH_MODE: local
      BILLING_PROVIDER: local
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://app:local-postgres-password@postgres:5432/app
      ENABLE_SWAGGER: 'true'
      LOCAL_BILLING_WEBHOOK_SECRET: local-stripe-style-webhook-secret
      NODE_ENV: development
      PORT: 3001
      WORKER_SECRET: local-worker-secret-change-me
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:3001/api/v1/health',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - '3001:3001'

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      BILLING_JOB_BATCH_SIZE: 10
      BILLING_JOB_LEASE_MS: 60000
      BILLING_JOB_MAX_ATTEMPTS: 5
      BILLING_JOB_POLL_MS: 1000
      BILLING_JOB_RETRY_MS: 30000
      BILLING_PROCESSOR_URL: http://api:3001/api/v1/internal/billing/jobs
      DATABASE_URL: postgresql://app:local-postgres-password@postgres:5432/app
      NODE_ENV: development
      WORKER_SECRET: local-worker-secret-change-me

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_AUTH_TOKEN: local-development-token-change-me-1234567890
      API_URL: http://api:3001
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
    ports:
      - '3000:3000'

volumes:
  postgres-data:

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      CORS_ORIGIN: http://localhost:3000
      ENABLE_SWAGGER: 'true'
      NODE_ENV: production
      PORT: 3001
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:3001/api/v1/health',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '3001:3001'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:3001
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
    ports:
      - '3000:3000'

